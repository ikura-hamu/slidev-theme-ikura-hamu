on:
  push:
    tags:
      - v*.*.*
      - create-v*.*.*

jobs:
  publish-theme:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: latest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Set version
        run: pnpm version ${{ github.ref_name }} --no-git-tag-version

      - name: Publish
        run: pnpm publish --access public --no-git-checks

  publish-creator:
    if: startsWith(github.ref_name, 'create-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: latest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test creator
        run: pnpm test:creator

      - name: Set version
        run: pnpm --dir packages/create-slidev-theme-ikura-hamu version "${GITHUB_REF_NAME#create-v}" --no-git-tag-version

      - name: Publish
        run: pnpm --dir packages/create-slidev-theme-ikura-hamu publish --access public --no-git-checks
